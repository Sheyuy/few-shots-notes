name: p011-sortsat
on:
  workflow_dispatch:
    inputs:
      depth: {default: '12'}
      maxc: {default: '70'}
      prefix: {default: 'none'}      # none | base | layer1
      minutes: {default: '300'}
      seed: {default: '1'}
jobs:
  sortsat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: install kissat
        run: |
          (sudo apt-get install -y kissat && echo "apt ok") || \
          (git clone --depth 1 https://github.com/arminbiere/kissat.git && \
           cd kissat && ./configure && make -j2 && sudo cp build/kissat /usr/local/bin/ && echo "src ok")
          kissat --version | head -2
      - name: build
        run: |
          cd src/mavis/p011
          gcc -O2 -o sortsat sortsat.c
          gcc -O2 -o netcheck netcheck.c
          ./netcheck baseline_pairs.txt 17
      - name: prepare prefix
        run: |
          cd src/mavis/p011
          if [ "${{ github.event.inputs.prefix }}" = "base" ]; then cp prefix_base.txt prefix_use.txt
          elif [ "${{ github.event.inputs.prefix }}" = "layer1" ]; then head -1 prefix_base.txt > prefix_use.txt
          else echo "#" > prefix_use.txt; fi
          cat prefix_use.txt
      - name: run iterative search
        run: |
          cd src/mavis/p011
          mkdir -p work
          # seed the test-input set with the accumulated hard inputs from the
          # previous runs: each counterexample tightens the next instance
          cp hard_inputs.txt work/inputs.txt
          wc -l work/inputs.txt
          python3 sortsat_loop.py 17 ${{ github.event.inputs.depth }} \
            ${{ github.event.inputs.maxc }} prefix_use.txt work \
            ${{ github.event.inputs.minutes }} kissat | tee work/loop.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p011-sortsat-${{ github.event.inputs.depth }}-${{ github.event.inputs.maxc }}-${{ github.event.inputs.prefix }}-${{ github.event.inputs.seed }}
          path: |
            src/mavis/p011/work/
            src/mavis/p011/sortsat.c
            src/mavis/p011/netcheck.c
            src/mavis/p011/sortsat_loop.py

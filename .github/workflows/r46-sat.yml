name: r46-sat
# Solver for the 36-vertex (4,6)-Ramsey graph (problem p003) on GitHub-hosted
# runners.  The local sandbox has only 1.3 CPU cores and is rebooted every few
# hours, which kills long SAT runs; a hosted runner gives a full 6-hour,
# uninterrupted job per instance.
#
# Trigger manually:
#   gh workflow run r46-sat.yml -f d=11 -f mode=4
# or via the API (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      d:
        description: "degree of vertex 0 in the symmetry break (11..17), or 'plain'"
        required: true
        default: "11"
      mode:
        description: "sat36.c mode: 4 = symmetry break + degree constraints, 5 = no symmetry break + degree constraints"
        required: true
        default: "4"
      minutes:
        description: "solver time limit in minutes"
        required: true
        default: "330"
      tag:
        description: "label for the uploaded artifacts"
        required: false
        default: ""

permissions:
  contents: write      # so the solver can push partial progress to a branch

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: build solver and fetch kissat
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential unzip > /dev/null
          gcc -O2 -o sat36 src/mavis/p003/sat36.c
          curl -sSL -o kissat.zip \
            https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip
          unzip -o -q kissat.zip
          chmod +x kissat-4.0.4-linux-amd64
          ./kissat-4.0.4-linux-amd64 --version

      - name: generate CNF
        run: |
          set -e
          D="${{ inputs.d }}"
          MODE="${{ inputs.mode }}"
          if [ "$D" = "plain" ]; then D=-1; fi
          echo "mode=$MODE d=$D"
          ./sat36 cnf.cnf "$MODE" "$D"
          ls -la cnf.cnf

      - name: solve
        run: |
          set -e
          MIN="${{ inputs.minutes }}"
          timeout "${MIN}m" ./kissat-4.0.4-linux-amd64 cnf.cnf > out.log 2>&1 &
          PID=$!
          # push partial progress to a branch every 10 minutes, so the result is
          # visible (and survives) even if this session or the job dies
          git config user.email "solver@local"
          git config user.name "r46-sat"
          git checkout -B "progress/${{ github.run_id }}" || true
          while kill -0 $PID 2>/dev/null; do
            sleep 600
            git add -A out.log cnf.cnf 2>/dev/null || true
            git commit -q -m "progress $(date -u +%H:%M:%S)" 2>/dev/null || true
            git push -q -f origin "progress/${{ github.run_id }}" 2>/dev/null || true
          done
          wait $PID || true
          git add -A out.log 2>/dev/null || true
          git commit -q -m "final $(date -u +%H:%M:%S)" 2>/dev/null || true
          git push -q -f origin "progress/${{ github.run_id }}" 2>/dev/null || true
          echo "--- verdict ---"
          grep -E "^s " out.log || echo "NO VERDICT (timeout)"
          tail -3 out.log

      - name: extract certificate if SAT
        id: cert
        run: |
          set -e
          if grep -q "^s SATISFIABLE" out.log; then
            python3 src/mavis/p003/sat2shot.py out.log --n 36 --out cert_out
            echo "CERT=cert_out/certificate.json" >> "$GITHUB_OUTPUT"
            echo "SATISFIABLE=true" >> "$GITHUB_OUTPUT"
          else
            echo "SATISFIABLE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r46-${{ inputs.tag || inputs.mode }}-${{ inputs.d }}-${{ github.run_id }}
          path: |
            out.log
            cert_out/certificate.json
          if-no-files-found: warn

      - name: summary
        if: always()
        run: |
          {
            echo "### r46-sat d=${{ inputs.d }} mode=${{ inputs.mode }}"
            echo "verdict: $(grep -E '^s ' out.log || echo none)"
            echo "conflicts: $(grep -E '^c ' out.log | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"

name: p011-ganet
on:
  workflow_dispatch:
    inputs:
      seconds: {default: '3000'}
      seed: {default: '1'}
      pop: {default: '40'}
      maxc: {default: '70'}
jobs:
  ganet:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # ganet.c and baseline.json live in src/mavis/p011; without this every
    # run step starts at the repo root and `gcc ganet.c` fails in ~7 s.
    defaults:
      run:
        working-directory: src/mavis/p011
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          gcc -O2 -o ganet ganet.c -lm
          ./ganet baseline.json 30 ${{ github.event.inputs.seed }} warm.json 40 ${{ github.event.inputs.maxc }}
      - name: run
        run: |
          ./ganet baseline.json ${{ github.event.inputs.seconds }} ${{ github.event.inputs.seed }} best.json ${{ github.event.inputs.pop }} ${{ github.event.inputs.maxc }}
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p011-ganet-${{ github.event.inputs.seed }}
          # artifact paths are resolved from the repo root, not from
          # defaults.run.working-directory
          path: |
            src/mavis/p011/best.json
            src/mavis/p011/ganet.c

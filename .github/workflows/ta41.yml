name: ta41
# Job-shop scheduling ta41 on GitHub-hosted runners.
# Board record: makespan 2006 (Shylo & Pardalos 2008).  We need <= 2005.
#
# src/mavis/p009/jssp15.c contains the ta41 instance plus the tabu search with
# path relinking.  Important: the original src/jssp.c never actually ran the
# relinking (the elite pool stayed at size 1 because 2006 is already the
# record, so the "new best" branch never fired); jssp15.c feeds the pool at
# every restart and runs a local-search burst on every bridge step
# (Peng/Lu/Cheng style).
#
#   gh workflow run ta41.yml -f minutes=330 -f procs=2 -f seed=1

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "search time per process in minutes"
        required: true
        default: "330"
      procs:
        description: "parallel processes per runner"
        required: true
        default: "2"
      seed:
        description: "base RNG seed"
        required: true
        default: "1"
      burst:
        description: "local-search iterations per bridge step (0 = off)"
        required: false
        default: "200"
      bridge:
        description: "number of relinking bridges per restart"
        required: false
        default: "2"
      nb:
        description: "neighbourhood: 0=N1 1=N5 2=N6 3=N8 4=N1+N8"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          set -e
          gcc -O3 -o jssp15 src/mavis/p009/jssp15.c -lm
          echo built

      - name: search
        run: |
          set -e
          MIN="${{ inputs.minutes }}"
          SECS=$((MIN * 60))
          N="${{ inputs.procs }}"
          SEED="${{ inputs.seed }}"
          BURST="${{ inputs.burst }}"
          BR="${{ inputs.bridge }}"
          NB="${{ inputs.nb }}"
          mkdir -p out
          for i in $(seq 1 "$N"); do
            # jssp15 flag names: -i init -t seconds -s seed -o out -l log
            ./jssp15 -i src/mavis/p009/best.json -t "$SECS" -s $((SEED * 1000 + i)) \
                     --nb "$NB" --bridge "$BR" --burst "$BURST" --restart 2000 --multistart 40 \
                     -o "out/s$i.json" -l "out/s$i.log" > "out/s$i.out" 2>&1 &
          done
          wait
          grep -h "NEW BEST" out/*.log | tail -5 || true
          grep -h "bursts=" out/*.log | tail -2 || true

      - name: pick best and validate
        run: |
          set -e
          python3 src/mavis/p009/pick_best.py src/mavis/p009/instance.json out out/best.json
          echo "--- independent makespan of the chosen schedule ---"
          python3 - <<'PY'
          import json
          inst = json.load(open("src/mavis/p009/instance.json"))
          d = json.load(open("out/best.json"))
          sys.path.insert(0, "src/mavis/p009")
          from pick_best import makespan
          ms = makespan(d["machines"], inst["routes"], inst["durations"])
          print("recomputed makespan:", ms)
          assert ms is not None and ms <= 2006, ms
          if ms < 2006:
              print("*** NEW RECORD: makespan", ms)
          PY

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ta41-${{ inputs.seed }}-${{ github.run_id }}
          path: |
            out/best.json
            out/*.log
          if-no-files-found: warn

      - name: summary
        if: always()
        run: |
          {
            echo "### ta41 seed=${{ inputs.seed }} procs=${{ inputs.procs }}"
            grep -h "NEW BEST" out/*.log 2>/dev/null | tail -5 || true
            grep -h "bursts=" out/*.log 2>/dev/null | tail -2 || true
          } >> "$GITHUB_STEP_SUMMARY"
